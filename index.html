<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>O Próximo Capítulo</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

</head>


<body>


<main class="container">


<h1>
O próximo capítulo
</h1>



<div class="journey">


    <div class="country">

        <span>🇧🇷</span>

        <p>Brasil</p>

    </div>



    <div class="route">


        <div class="line"></div>


        <div class="gold-dot"></div>


    </div>



    <div class="country">

        <span>🇦🇺</span>

        <p>Austrália</p>

    </div>


</div>




<section id="countdown">


<div>

<strong id="days">000</strong>

<span>Dias</span>

</div>


<div>

<strong id="hours">00</strong>

<span>Horas</span>

</div>


<div>

<strong id="minutes">00</strong>

<span>Minutos</span>

</div>


<div>

<strong id="seconds">00</strong>

<span>Segundos</span>

</div>


</section>




<p class="date">

03 de janeiro de 2027

</p>




<div id="finalMessage">

❤️

<br>

Conseguimos.

</div>



<script src="script.js"></script>


</main>


</body>

</html>
