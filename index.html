<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Next Chapter ❤️</title>

    <link rel="stylesheet" href="style.css">

    <!-- Fonte elegante -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Céu com estrelas -->
    <div id="stars"></div>

    <!-- Avião -->
    <div class="plane">
        ✈️
    </div>

    <!-- Conteúdo -->
    <main class="container">

        <h1>Our Next Chapter</h1>

        <p class="subtitle">
            Every second brings us closer to the life we've been dreaming of.
        </p>

        <div class="map">

            <span class="country">
                🇧🇷 Brazil
            </span>

            <div class="line"></div>

            <span class="country">
                🇦🇺 Australia
            </span>

        </div>

        <section id="countdown">

            <div class="box">
                <span id="days">000</span>
                <small>Days</small>
            </div>

            <div class="box">
                <span id="hours">00</span>
                <small>Hours</small>
            </div>

            <div class="box">
                <span id="minutes">00</span>
                <small>Minutes</small>
            </div>

            <div class="box">
                <span id="seconds">00</span>
                <small>Seconds</small>
            </div>

        </section>

        <p class="footer-text">

            Until we begin the most beautiful chapter of our lives. ❤️

        </p>

        <div id="finalMessage"></div>

    </main>

    <!-- Estrelas -->
    <script src="stars.js"></script>

    <!-- Contagem -->
    <script src="script.js"></script>

</body>

</html>
