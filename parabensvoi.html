<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body{
    margin:0;
    background:#000;
}

.player{
    position:relative;
    width:100%;
}

video{
    width:100%;
    height:auto;
    display:block;
    background:#000;
}

.play{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:90px;
    height:90px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    background:rgba(0,0,0,.65);
    color:white;
    font-size:42px;
    z-index:10;
}

.play:hover{
    transform:translate(-50%,-50%) scale(1.08);
}
</style>

</head>

<body>

<div class="player">

<video id="video" controls preload="auto" playsinline>
    <source src="https://helencf93-oss.github.io/carlos-birthday/parabensvoi.mp4" type="video/mp4">
</video>

<button class="play" id="play">▶</button>

</div>

<script>
const video = document.getElementById("video");
const play = document.getElementById("play");

play.addEventListener("click", async () => {
    try {
        await video.play();
        play.style.display = "none";
    } catch(e) {}
});

video.addEventListener("play", () => {
    play.style.display = "none";
});

video.addEventListener("pause", () => {
    if(video.currentTime < video.duration){
        play.style.display = "block";
    }
});

video.addEventListener("ended", () => {
    play.style.display = "block";
});
</script>

</body>
</html>
